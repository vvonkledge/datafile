name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # cz check needs the PR's commits, not just the merge tip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The version and the changelog are derived from commit messages, so a
      # non-conventional message contributes nothing to the release and leaves
      # the bump job with nothing to act on. Caught here rather than after merge,
      # when the message is no longer cheap to fix.
      #
      # Merge commits are exempt by commitizen itself, so the merge-commit PR
      # flow this repo uses does not need special handling.
      - name: Commit messages are conventional
        if: github.event_name == 'pull_request'
        run: |
          uvx --from commitizen cz check \
            --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Lint
        run: uvx ruff check .

      - name: Tests
        run: uv run test_datafile.py -q

      # datafile.py generates its agent skill from the argparse tree, so adding
      # a command silently stales it. The skill carries no machine-specific
      # paths, so this check is portable. It carries no version string either,
      # so a bump cannot stale it.
      #
      # `pi-package --check` is deliberately NOT run here: pi-package bakes the
      # generating machine's absolute path into README.md and
      # extensions/ambient-context.ts as a PATH fallback, so the check can only
      # pass on the machine that generated it. Verified failing on linux.
      - name: Generated skill is current
        run: uv run datafile.py skill --check --scope project --app pi

  # Bumps the version, writes CHANGELOG.md, tags, pushes back to main, and
  # publishes the tag as a GitHub release.
  # Pushes made with GITHUB_TOKEN do not trigger workflows, and the bump message
  # carries [skip ci], so this cannot retrigger itself.
  bump:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # cz reads tags to find the last release and the changelog range.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bump, tag, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          uvx --from commitizen cz bump --yes
          rc=$?
          set -e

          case $rc in
            0)  ;;
            # NO_COMMITS_TO_BUMP. Normal for a docs-only or chore-only push, not
            # a failure: there is simply no releasable change since the last tag.
            21) echo "no releasable commits since the last tag"; exit 0 ;;
            *)  exit $rc ;;
          esac

          git push --follow-tags

          # A pushed tag is invisible on the releases page until something
          # publishes it. The body is the section cz just wrote for this version,
          # so the release and CHANGELOG.md cannot disagree.
          tag="v$(uvx --from commitizen cz version --project)"
          uvx --from commitizen cz changelog --dry-run "$tag" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
